schema = 1

[workspace]
production = [
  "preview-domain", "preview-application", "preview-adapter-fs",
  "preview-adapter-http", "preview-composition", "preview-cli",
]
test_only = ["preview-testkit", "preview-conformance"]
tool_only = ["xtask"]

[dependencies.normal]
preview-domain = []
preview-application = ["preview-domain"]
preview-adapter-fs = ["preview-application", "preview-domain"]
preview-adapter-http = ["preview-application", "preview-domain"]
preview-composition = [
  "preview-domain", "preview-application",
  "preview-adapter-fs", "preview-adapter-http",
]
preview-cli = ["preview-composition"]
preview-testkit = ["preview-domain", "preview-application"]
preview-conformance = [
  "preview-domain", "preview-application", "preview-testkit",
  "preview-adapter-fs", "preview-adapter-http",
]
xtask = []

# Third-party crates each workspace crate may use directly, by dependency kind (ADR 0013,
# ADR 0033). The value lists the features the dependency may enable ("default" stands for
# its default features), or is "*" for any. A crate allowed under `normal` is also allowed
# as a dev-dependency.
[external.normal]
preview-cli = { clap = ["default", "derive", "std", "help", "usage", "error-context"] }
xtask = { cargo_metadata = ["default"], clap = ["default", "derive"], serde = ["default", "derive"], toml = ["default"] }

[external.dev]
preview-cli = { assert_cmd = ["default"], predicates = ["default"] }
xtask = { tempfile = ["default"] }

[external.build]

[exceptions]
