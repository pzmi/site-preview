schema = 1

[workspace]
production = [
  "preview-domain", "preview-application", "preview-adapter-fs",
  "preview-adapter-http", "preview-composition", "preview-cli",
]
test_only = ["preview-testkit", "preview-conformance"]
tool_only = ["xtask"]

# Allowed workspace edges (foundation.md section 2.1). A dev-dependency may target a
# test_only crate or a crate in the dependent's normal list. No production crate may reach a
# test_only or tool_only crate over normal or build edges, and the lists must be acyclic.
[dependencies.normal]
preview-domain = []
preview-application = ["preview-domain"]
preview-adapter-fs = ["preview-application", "preview-domain"]
preview-adapter-http = ["preview-application", "preview-domain"]
preview-composition = [
  "preview-domain", "preview-application",
  "preview-adapter-fs", "preview-adapter-http",
]
preview-cli = ["preview-composition"]
preview-testkit = ["preview-domain", "preview-application"]
preview-conformance = [
  "preview-domain", "preview-application", "preview-testkit",
  "preview-adapter-fs", "preview-adapter-http",
]
xtask = []

# Workspace build-dependencies; none are allowed unless listed here.
[dependencies.build]

# Third-party crates each workspace crate may use directly, by dependency kind (ADR 0013,
# ADR 0033). The value lists the features the dependency may enable ("default" stands for
# its default features), or is "*" for any. A crate allowed under `normal` is also allowed
# as a dev-dependency.
[external.normal]
preview-domain = { percent-encoding = ["default"] }
preview-adapter-fs = { rustix = ["fs", "std"] }
preview-adapter-http = { axum = ["http1", "tokio"], lol_html = [], mime_guess = [], serde_json = ["std"], tokio = ["rt", "sync"], tokio-stream = ["default"] }
preview-application = { tokio = ["sync"] }
preview-composition = { axum = ["http1", "tokio"], tokio = ["rt-multi-thread", "net", "signal"] }
preview-cli = { clap = ["default", "derive", "std", "help", "usage", "error-context"] }
xtask = { cargo_metadata = ["default"], clap = ["default", "derive"], proc-macro2 = ["span-locations"], serde = ["default", "derive"], syn = ["parsing", "full", "visit", "clone-impls"], toml = ["default"], yaml-rust2 = [] }

[external.dev]
preview-adapter-fs = { tempfile = ["default"], trybuild = ["default"] }
preview-adapter-http = { http-body-util = ["default"], tokio = ["rt", "macros", "test-util"], tower = ["util"] }
preview-cli = { assert_cmd = ["default"], predicates = ["default"], tempfile = ["default"] }
preview-application = { proptest = ["default"], tokio = ["rt", "macros"] }
preview-domain = { proptest = ["default"], trybuild = ["default"] }
xtask = { tempfile = ["default"] }

[external.build]

# Approved departures, each citing an ADR. `[exceptions.sources]` maps a non-crates.io
# source (without query or revision) to `{ adr = "NNNN" }`.
[exceptions]
