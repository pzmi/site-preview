name: Release

# The release pipeline of plan section 11 M5 (OPS-06, ADR 0078): four archives built and smoked
# on their native runners, SHA256SUMS, one CycloneDX SBOM per archive, build-provenance
# attestations, and a DRAFT GitHub release that the owner publishes by hand after `verify` is
# green ([doc/release.md](../../doc/release.md)). This workflow never publishes a release, never
# creates or moves a tag and never publishes to crates.io (D24). It restores no cache (ADR 0061),
# so nothing cached reaches a release artifact. Only `publish` can write, and only with
# GITHUB_TOKEN; tools/xtask/src/release.rs (should_grant_write_permissions_only_to_publish_when_release_yml_is_read)
# keeps it that way.
#
# Two ways in, both run from the tag itself, so the provenance names the commit that was built:
# - a push of a `v*` tag: a release, `v<workspace version>`, on a commit of `main`;
# - a manual dispatch from the tag (`gh workflow run release.yml --ref <tag> -f tag=<tag>`):
#   with `dry_run` (the default) the tag must be named `dry-run-<name>` and the draft is titled
#   and flagged as a dry run; without it, the tag must be a release tag as above (a rerun).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release; must equal the ref the workflow is run from"
        required: true
        type: string
      dry_run:
        description: "Dry run: a dry-run-<name> tag, a draft marked DRY RUN"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
      title: ${{ steps.tag.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag and origin/main, for the ancestry check

      # Every input is read from the environment and matched against a fixed pattern before it is
      # printed or used; nothing user-supplied is interpolated into the script.
      - name: Validate the tag and the mode
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          release_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]{1,32})?$'
          dry_re='^dry-run-[0-9A-Za-z.-]{1,40}$'
          case "$EVENT" in
            push) tag="$REF_NAME"; dry_run=false ;;
            workflow_dispatch) tag="$INPUT_TAG"; dry_run="$INPUT_DRY_RUN" ;;
            *) fail "release.yml runs on a tag push or a manual dispatch only" ;;
          esac
          case "$dry_run" in
            true) [[ "$tag" =~ $dry_re ]] || fail "a dry run takes a tag named dry-run-<letters, digits, . or ->" ;;
            false) [[ "$tag" =~ $release_re ]] || fail "a release takes a tag named v<major>.<minor>.<patch>[-<pre>]" ;;
            *) fail "dry_run must be true or false" ;;
          esac
          # The tag is now known to be harmless to print.
          if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$tag" ]; then
            fail "run the workflow from the tag $tag itself (gh workflow run release.yml --ref $tag -f tag=$tag), so the provenance names the built commit"
          fi
          # Both sides peeled to a commit, so an annotated tag compares equal too.
          tagged="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")" || fail "no tag $tag"
          running="$(git rev-parse --verify --quiet "$GITHUB_SHA^{commit}")" || fail "no commit for this run"
          [ "$tagged" = "$running" ] || fail "tag $tag points to $tagged, but this run is for $running (was it moved?)"
          if [ "$dry_run" = false ]; then
            version="$(git show "$tagged:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -n 1)"
            [ "$tag" = "v$version" ] || fail "tag $tag does not match the workspace version $version"
            git merge-base --is-ancestor "$tagged" origin/main || fail "$tag is not on main"
            title="site-preview $tag"
          else
            title="DRY RUN $tag (delete, never publish)"
          fi
          {
            echo "tag=$tag"
            echo "dry_run=$dry_run"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          echo "release $tag (dry run: $dry_run) from $tagged"

  # One archive per target on its native runner (plan section 11 M5): release-check builds with
  # --locked, packages site-preview-<target>.tar.gz with its THIRD-PARTY-NOTICES, and smokes the
  # extracted binary with a clean environment (ADR 0076).
  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache, by design (ADR 0061): the toolchain comes from rust-toolchain.toml and the
      # tools are built from crates.io at their pinned versions.
      - name: Install the toolchain and the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      - name: Install the musl linker driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Install cargo-about
        run: cargo xtask install-tools cargo-about

      - name: Package and smoke the release archive
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask release-check --target "$TARGET"

      - name: Keep the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: target/release-check/${{ matrix.target }}/site-preview-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Keep the smoke logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-check-logs-${{ matrix.target }}-${{ github.run_attempt }}
          path: target/release-check/${{ matrix.target }}/logs/*.log
          if-no-files-found: warn
          retention-days: 30

  # The only job that can write: it creates the draft release (contents), and signs the
  # provenance with the run's OIDC identity (id-token, attestations). No other secret is used.
  publish:
    name: Publish the draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain and cargo-cyclonedx
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo xtask install-tools cargo-cyclonedx

      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: Write one SBOM per archive
        run: cargo xtask sbom --out dist

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          want=()
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            want+=("site-preview-$target.tar.gz" "site-preview-$target.cdx.json")
          done
          expected="$(printf '%s\n' "${want[@]}" | LC_ALL=C sort)"
          present="$(shopt -s nullglob; printf '%s\n' * | LC_ALL=C sort)"
          if [ "$present" != "$expected" ]; then
            echo "::error::dist/ does not hold exactly the four archives and their SBOMs"
            diff <(echo "$expected") <(echo "$present") || true
            exit 1
          fi
          printf '%s\n' "$expected" | xargs sha256sum -- > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/site-preview-*.tar.gz
            dist/site-preview-*.cdx.json

      # A draft only: `--draft` is not a mode of this step, it is the only thing it does.
      # `--verify-tag` refuses to run unless the tag already exists on GitHub, so gh never
      # creates one, and an existing release for the tag (draft or not) stops the job instead of
      # receiving new assets.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq -- "$TAG" <<< "$tags"; then
            echo "::error::a release for $TAG exists already; delete it (doc/release.md) and rerun"
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            if [ "$DRY_RUN" = true ]; then
              echo "**DRY RUN of the release workflow. Delete this draft; never publish it.**"
              echo
            fi
            echo "site-preview $TAG, built from $GITHUB_SHA by $RUN_URL."
            echo
            echo "Verify a download:"
            echo
            echo '```sh'
            echo 'sha256sum --ignore-missing -c SHA256SUMS   # macOS: shasum -a 256 --ignore-missing -c SHA256SUMS'
            echo "gh attestation verify site-preview-<target>.tar.gz --repo $GH_REPO"
            echo '```'
          } > "$notes"
          args=(--draft --verify-tag --title "$TITLE" --notes-file "$notes")
          if [ "$DRY_RUN" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*

      # Reads the assets back from the draft release (this job's token is the one that can see a
      # draft), checks them against SHA256SUMS and byte for byte against what was uploaded, and
      # hands exactly those downloaded bytes to `verify`.
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published"
          mkdir "$published"
          gh release download "$TAG" --dir "$published"
          cd "$published"
          sha256sum -c SHA256SUMS
          names() { (cd "$1" && shopt -s nullglob && printf '%s\n' * | LC_ALL=C sort); }
          if [ "$(names .)" != "$(names "$GITHUB_WORKSPACE/dist")" ]; then
            echo "::error::the draft release does not hold exactly the uploaded assets"
            exit 1
          fi
          for file in *; do
            cmp -- "$file" "$GITHUB_WORKSPACE/dist/$file"
          done

      - name: Keep the published assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-assets
          path: ${{ runner.temp }}/published/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Each archive as published, on its own OS: SHA256SUMS, the provenance attestation, then the
  # smoke of the extracted binary (release-check --archive, which builds nothing).
  verify:
    name: Verify (${{ matrix.target }})
    needs: [prepare, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Download the published assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-assets
          path: ${{ runner.temp }}/published

      # GNU coreutils on Linux, shasum on macOS; both read the `<hash>  <name>` lines.
      - name: Check SHA256SUMS
        working-directory: ${{ runner.temp }}/published
        run: |
          set -euo pipefail
          if command -v sha256sum > /dev/null; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          listed="$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)"
          present="$(shopt -s nullglob; for f in *; do [ "$f" = SHA256SUMS ] || printf '%s\n' "$f"; done | LC_ALL=C sort)"
          if [ "$listed" != "$present" ]; then
            echo "::error::SHA256SUMS does not list exactly the published files"
            exit 1
          fi

      - name: Verify the provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          command -v gh > /dev/null || { echo "::error::gh is not installed on this runner"; exit 1; }
          gh attestation verify "$RUNNER_TEMP/published/site-preview-$TARGET.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Smoke the published archive
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask release-check --target "$TARGET" --archive "$RUNNER_TEMP/published/site-preview-$TARGET.tar.gz"

      - name: Keep the smoke logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-logs-${{ matrix.target }}-${{ github.run_attempt }}
          path: target/release-check/${{ matrix.target }}/logs/*.log
          if-no-files-found: warn
          retention-days: 30
