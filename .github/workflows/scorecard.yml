name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain practice and publishes the score behind
# the README badge (ADR 0082). It is not in `Required`. `publish_results: true` restricts this
# workflow: no top-level env or defaults, no write permission at the top, and only the actions
# Scorecard allows (checkout, scorecard-action, upload-artifact, upload-sarif).

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write # the SARIF upload to code scanning
      id-token: write # publish_results: proves to the Scorecard API which workflow ran
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
