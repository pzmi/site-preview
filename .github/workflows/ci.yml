name: CI

# The blocking gate, one job per level of foundation.md section 10, each running
# `cargo xtask check --only <stages>` so a job and the same command on a laptop run the same
# stage code (OPS-02, ADR 0072). `required` needs every job and is the one result to watch.
# tools/xtask/src/check.rs (should_cover_each_in_check_stage_once_when_ci_jobs_are_read) fails
# when an `in_check` stage of the catalog is in no job or in two, so no stage is dropped
# silently. Every job installs only the tools its stages need.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  architecture:
    name: Architecture and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: architecture

      - name: Architecture and policy
        run: cargo xtask check --only architecture

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  static:
    name: Static quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: static

      - name: Static quality
        run: cargo xtask check --only fmt-check,fuzz-fmt,clippy,docs

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  fast-tests:
    name: Fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: fast-tests
          tools: cargo-nextest

      - name: Fast tests
        run: cargo xtask check --only unit-tests,doctests,client-js

      - name: Keep the JUnit report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-fast-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: integration
          tools: cargo-nextest cargo-deny

      # xtask's security fixture tests run the real cargo-deny, Gitleaks and actionlint.
      - name: Install Gitleaks and actionlint
        uses: ./.github/actions/install-scanners

      - name: Integration
        run: cargo xtask check --only integration-tests

      - name: Keep the JUnit report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # The product crates' unit and integration tests (adapter-fs, the real OS watcher, the symlink
  # race, the CLI black-box suites) on each native platform, because the code under test is the
  # operating system's: inotify, FSEvents, openat/O_NOFOLLOW errnos, signals (foundation.md
  # section 10, OPS-03, ADR 0074). It installs neither Gitleaks nor actionlint
  # (linux x86-64 only) and so runs `cargo xtask test --only platform-tests`, which leaves out
  # the xtask package whose fixtures need them; every `check` stage stays in exactly one other
  # job. Every platform runs to the end (`fail-fast: false`) so one red leg never hides another.
  platform:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: platform-${{ matrix.os }}
          tools: cargo-nextest

      - name: Platform tests
        run: cargo xtask test --only platform-tests

      - name: Keep the JUnit report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-platform-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  conformance:
    name: Conformance (Quint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: conformance
          tools: cargo-nextest

      # The conformance stages run the locked Quint; npx never fetches it (ADR 0052, ADR 0060).
      # Node is the runner's preinstalled one (22 or newer, tools/versions.toml).
      - name: Install Quint
        run: npm ci --prefix formal

      - name: Conformance (Quint)
        run: cargo xtask check --only formal-typecheck,formal-scenarios,formal-simulate,formal-freshness,formal-generate,conformance-replay,conformance-controls

      - name: Keep the traces and report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            formal/traces/generated/
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # On a push, the changed-line gate starts from the commit the branch was at before it
      # (every commit of the push counts, not only the last); a pull request and a new branch
      # (the all-zeros SHA) use the merge-base with origin/main (ADR 0069). The SHA reaches the
      # xtask as an environment variable, never interpolated into a script.
      CHANGED_LINES_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the changed-line gate needs the merge-base and the pushed range

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: coverage
          tools: cargo-nextest cargo-llvm-cov cargo-deny

      # xtask's security fixture tests run the real cargo-deny, Gitleaks and actionlint.
      - name: Install Gitleaks and actionlint
        uses: ./.github/actions/install-scanners

      # The conformance stages run the locked Quint; npx never fetches it (ADR 0052, ADR 0060).
      # Node is the runner's preinstalled one (22 or newer, tools/versions.toml).
      - name: Install Quint
        run: npm ci --prefix formal

      - name: Coverage
        run: cargo xtask check --only coverage,changed-lines

      - name: Keep the LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

      - name: Keep the JUnit report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/llvm-cov-target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the secrets stage scans the whole history

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: security
          tools: cargo-deny

      - name: Install Gitleaks and actionlint
        uses: ./.github/actions/install-scanners

      - name: Security
        run: cargo xtask check --only deny,deny-fuzz,secrets,workflows,action-pins

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  browser:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: browser

      # The browser stage never downloads a browser itself (D9); CI provides Chromium here.
      - name: Install Chromium for Playwright
        working-directory: tests/e2e/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Browser
        run: cargo xtask check --only browser

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/browser/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  artifact-smoke:
    name: Artifact smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          job: artifact-smoke
          tools: cargo-about

      # The Linux release archives are musl builds (plan section 11 M5): the standard library of
      # the target and the distribution's musl linker driver.
      - name: Install the musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      # Builds the musl release binary, packages site-preview-<target>.tar.gz with the
      # THIRD-PARTY-NOTICES that cargo-about generates, extracts it into a fresh directory and
      # runs the extracted binary with `env -i PATH=/usr/bin:/bin` on a copy of the fixture
      # (OPS-05, ADR 0076). OPS-06's release workflow runs the same command per native runner.
      - name: Package and smoke the release archive
        run: cargo xtask release-check --target x86_64-unknown-linux-musl

      - name: Keep the smoke logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/release-check/*/logs/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save caches (main only)
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.cache-key }}
          hit: ${{ steps.rust.outputs.cache-hit }}

  # The one result to watch (and, in OPS-04, to require). It runs even when a needed job failed
  # or was cancelled and fails then; a needed job that was skipped fails it too, so a job can
  # never drop out of the gate by not running.
  required:
    name: Required
    if: ${{ always() }}
    needs:
      - architecture
      - static
      - fast-tests
      - integration
      - platform
      - conformance
      - coverage
      - security
      - browser
      - artifact-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
