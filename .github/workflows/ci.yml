name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The pinned tools the gate needs (tools/versions.toml); coverage and changed-lines need
      # cargo-llvm-cov. The list is part of the cache key, so changing it saves a new
      # ~/.cargo/bin instead of reusing one cached without the new tool.
      DEV_TOOLS: cargo-nextest cargo-deny cargo-llvm-cov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the security stage scans the whole history

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, build output and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/versions.toml') }}-${{ env.DEV_TOOLS }}
          restore-keys: |
            check-${{ runner.os }}-

      - name: Install Gitleaks and actionlint
        uses: ./.github/actions/install-scanners

      - name: Install pinned dev tools
        run: cargo xtask install-tools ${{ env.DEV_TOOLS }}

      # The browser stage never downloads a browser itself (D9); CI provides Chromium here.
      - name: Install Chromium for Playwright
        working-directory: tests/e2e/browser
        run: npm ci && npx playwright install --with-deps chromium

      # The conformance stages of check run the locked Quint (ADR 0060); npx never
      # fetches it (ADR 0052).
      - name: Install Quint for the conformance stages
        run: npm ci --prefix formal

      # On a push, the changed-line gate starts from the commit the branch was at before it
      # (every commit of the push counts, not only the last); a pull request and a new branch
      # (the all-zeros SHA) use the merge-base with origin/main (ADR 0069). The SHA reaches the
      # xtask as an environment variable, never interpolated into a script.
      - name: Full gate
        env:
          CHANGED_LINES_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: cargo xtask check
