name: Coverage report

# Publishes the LCOV report of a green CI run on `main` to Codecov for its history (ADR 0082).
# The coverage gate stays the `coverage` job of ci.yml with coverage-floor.toml; Codecov never
# gates. This runs after CI, not inside it, so `id-token: write` is never held by a job that
# builds or tests the tree, and Codecov's availability is not part of `Required`. It checks
# nothing out and runs no repository code: the downloaded report is its only input.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  upload:
    name: Upload to Codecov
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # the CI run's artifact
      id-token: write # Codecov OIDC, so no Codecov token is stored
    steps:
      - name: Download the LCOV report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: main
          fail_ci_if_error: true
