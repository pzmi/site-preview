name: Formal

# The nightly lanes of the Quint models (foundation.md sections 6.4 and 10, ADR 0060, ADR 0072).
# The blocking `Conformance (Quint)` job is in ci.yml, where it runs on every push and pull
# request through `cargo xtask check --only <the conformance stages>`; this workflow only
# repeats it nightly with a fresh seed, keeps the failing traces as artifacts, and runs the
# deep Apalache lane.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  conformance:
    name: Conformance (Quint, nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, build output and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: formal-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/versions.toml') }}
          restore-keys: |
            formal-${{ runner.os }}-

      - name: Install pinned dev tools
        run: cargo xtask install-tools cargo-nextest

      # Quint is locked by formal/package-lock.json; npx never fetches it (ADR 0052).
      - name: Install Quint
        run: npm ci --prefix formal

      # The seed is printed; QUINT_SEED=<seed> cargo xtask conformance repeats the run.
      - name: Conformance
        run: cargo xtask conformance

      # The generated traces and their manifest (seed, Quint version, families), the
      # regenerated regression traces a stale one is compared with, and nextest's report.
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            formal/traces/generated/
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

  # The scheduled deep lane (foundation.md section 6.4, FORMAL-10): `quint verify` through the
  # Apalache release pinned in tools/versions.toml (bounded model checking of every model's
  # invariants) and a multi-seed simulation far larger than the pull-request one. It is not part
  # of `cargo xtask check`. The hosted runner's default JDK (17 or newer) runs Apalache.
  # `formal-verify` fetches the pinned release itself, refuses it unless its SHA-256 equals the
  # one in tools/versions.toml, and unpacks it into ~/.quint before Quint runs (ADR 0061), so
  # ~/.quint is never cached: what runs is always unpacked from a verified tarball. The Miri
  # job below sits beside this one.
  formal-verify:
    name: Formal verification (Apalache)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # target/ holds the downloaded Apalache tarball too; it is re-hashed before every use.
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: formal-verify-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/versions.toml') }}
          restore-keys: |
            formal-verify-${{ runner.os }}-

      # Quint is locked by formal/package-lock.json; npx never fetches it (ADR 0052).
      - name: Install Quint
        run: npm ci --prefix formal

      - name: Show the JVM
        run: java -version

      # The base seed of the simulation is printed; QUINT_SEED=<seed> cargo xtask formal-verify
      # repeats it. A missing JVM or Apalache fails here with what to install, never a skip.
      - name: Verify
        run: cargo xtask formal-verify

      # The log of every run, Apalache's run directories with a counterexample as ITF and
      # TLA+ when it found one, and the ITF trace of a failing simulation. Promote a useful one
      # to formal/traces/regression/ (doc/formal-models.md, "Promoting a counterexample").
      - name: Keep the counterexamples of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal-verify/
          if-no-files-found: warn
          retention-days: 30

  # The scheduled Miri lane (foundation.md section 10, ADR 0026, ADR 0071, TEST-09): the unit
  # and component tests of preview-domain and preview-application under Miri on the dated
  # nightly of tools/versions.toml. It is not part of `cargo xtask check` and does not run for
  # pull requests. A missing component fails with what to install, never a skip.
  miri:
    name: Miri (domain and application)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, build output, tools and the Miri sysroot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/miri
            target
          key: miri-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/versions.toml') }}
          restore-keys: |
            miri-${{ runner.os }}-

      - name: Install pinned dev tools
        run: cargo xtask install-tools cargo-nextest nightly

      # The nightly is installed with the minimal profile, which has no Miri. The component
      # name and the date come from tools/versions.toml through xtask, so the pin has one owner.
      - name: Install Miri
        run: |
          nightly="$(sed -n '/^\[tools.nightly\]/,/^$/s/^version = "\(.*\)"/\1/p' tools/versions.toml)"
          rustup "+${nightly}" component add miri rust-src
          cargo "+${nightly}" miri setup

      - name: Miri
        run: cargo xtask formal-verify --miri
