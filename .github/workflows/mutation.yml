name: Mutation

# Weekly cargo-mutants run over the scope of .cargo/mutants.toml (foundation.md sections 5.3
# and 10, ADR 0068, ADR 0085). One of ten shards runs each week; full runs are manual.
# It reports findings and gates nothing. It is not part of `cargo xtask check`.
# The baseline and its triage are in doc/mutation-baseline.md.

on:
  schedule:
    - cron: "43 4 * * 0"
  workflow_dispatch:
    inputs:
      shard:
        description: 'auto (~50 mutants), full, or a zero-based shard such as 3/10'
        required: false
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  mutation:
    name: Mutation (cargo-mutants)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.shard == 'full' && 350 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mutation-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/versions.toml') }}
          restore-keys: |
            mutation-${{ runner.os }}-

      - name: Install pinned dev tools
        run: cargo xtask install-tools cargo-nextest cargo-mutants

      - name: Mutation
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.shard == 'full' && 330 || 20 }}
        env:
          REQUESTED_SHARD: ${{ inputs.shard || 'auto' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$REQUESTED_SHARD" == auto ]]; then
            # Epoch weeks rotate across ten shards; manual runs do not advance it.
            shard="$(( $(date -u +%s) / 604800 % 10 ))/10"
            args=(--shard "$shard")
          elif [[ "$REQUESTED_SHARD" != full ]]; then
            args=(--shard "$REQUESTED_SHARD")
          fi
          cargo xtask mutation "${args[@]}"

      - name: Publish the summary
        if: always()
        run: |
          if [ -f target/mutants/summary.md ]; then
            cat target/mutants/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/mutants/summary.md
            target/mutants/mutants.out/
          if-no-files-found: warn
          retention-days: 90
