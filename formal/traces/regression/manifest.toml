# The committed regression traces and how each one is regenerated (FORMAL-09, ADR 0060).
#
# `cargo xtask conformance` (stage formal-freshness) regenerates every trace listed here with
# the locked Quint, from the repository root:
#
#   npx --prefix formal --no -- quint run formal/<model> --backend typescript [--main <main>]
#     [--init <init>] --step <step> --max-steps <max_steps> --mbt --seed <seed>
#     [--invariant <invariant>] --out-itf formal/traces/generated/regression/<file>
#
# and compares it with the committed file byte for byte, `#meta.description` and
# `#meta.timestamp` (the creation date Quint writes) excepted. A stale file fails with
# `stale regression trace <file>`. Every `*.itf.json` in this directory has exactly one entry,
# and every script of a `*_traces.qnt` module has one; `max_steps` and `init` must match the
# comment above the script (unit-tested in tools/xtask/src/conformance.rs).

# FORMAL-04's decoder fixture: five random `serverStep` steps of the model itself.
[[trace]]
file = "itf-decoder-sample.itf.json"
model = "lifecycle.qnt"
step = "serverStep"
max_steps = 5
seed = "11"

[[trace]]
file = "lifecycle-startServeStop.itf.json"
model = "lifecycle_traces.qnt"
main = "lifecycleTraces"
step = "startServeStop"
max_steps = 5
seed = "0x5ce1"
invariant = "allInvariants"

