# Positive fixture: a workspace using every allowed edge kind, which must pass.
# - normal workspace edges along the whole dependency law;
# - dev edges to a test_only crate (a dev cycle with preview-domain), to a crate in the normal
#   list (preview-cli -> preview-composition) and from the tool crate to a test_only crate;
# - a listed workspace build edge (preview-composition -> preview-domain);
# - third-party edges: a feature list, "default" with its implied features, a feature implied
#   by a listed one (tokio "full"), "*"; dev through the normal list and through
#   [external.dev]; build through [external.build];
# - a listed Linux-only dependency and an unlisted Windows-only one (Windows not evaluated);
# - a git source approved in [exceptions.sources] by an ADR that exists;
# - semantic constructs that pass: filesystem authority in the fs adapter and bootstrap,
#   test-only code, literal include!, macro_rules, cfg branches, the testkit poll helper's
#   sleep, todo! in test code, and a lint suppression approved in [[exceptions.lints]].
# Third-party crates are empty stubs behind .cargo/config.toml; Cargo.lock is committed.
schema = 1

[workspace]
production = [
  "preview-domain", "preview-application", "preview-adapter-fs",
  "preview-adapter-http", "preview-composition", "preview-cli",
]
test_only = ["preview-testkit", "preview-conformance"]
tool_only = ["xtask"]

[dependencies.normal]
preview-domain = []
preview-application = ["preview-domain"]
preview-adapter-fs = ["preview-application", "preview-domain"]
preview-adapter-http = ["preview-application", "preview-domain"]
preview-composition = [
  "preview-domain", "preview-application",
  "preview-adapter-fs", "preview-adapter-http",
]
preview-cli = ["preview-composition"]
preview-testkit = ["preview-domain", "preview-application"]
preview-conformance = [
  "preview-domain", "preview-application", "preview-testkit",
  "preview-adapter-fs", "preview-adapter-http",
]
xtask = []

[dependencies.build]
preview-composition = ["preview-domain"]

[external.normal]
preview-domain = { percent-encoding = ["default"] }
preview-application = { tokio = ["sync"] }
preview-adapter-fs = { rustix = ["default"] }
preview-composition = { tokio = ["full"] }
preview-conformance = { gitdep = ["default"] }
xtask = { toml = "*" }

[external.dev]
preview-cli = { predicates = ["default"] }

[external.build]
preview-adapter-fs = { cc = ["default"] }

[exceptions.sources]
"git+https://example.invalid/gitdep.git" = { adr = "0001" }

[[exceptions.lints]]
path = "crates/preview-adapter-http/src/lib.rs"
lint = "clippy::type_complexity"
adr = "0002"
