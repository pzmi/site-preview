# The fuzz crate (SEC-04, ADR 0026, ADR 0063): cargo-fuzz layout, built only with the pinned
# nightly of fuzz/rust-toolchain.toml. It is not a member of the root workspace and has its own
# lockfile, so the stable production build, `cargo xtask check` and `cargo deny` never see it.
# `architecture.toml` lists it under `fuzz_only`; `cargo xtask fuzz` runs it.
[package]
name = "preview-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Fuzz targets for the preview server's security-critical parsers (never published)."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
lol_html = { version = "3.0.1", default-features = false }
preview-adapter-http = { path = "../crates/preview-adapter-http" }
preview-application = { path = "../crates/preview-application" }
preview-domain = { path = "../crates/preview-domain" }

# A copy of the root workspace's `[workspace.lints]` (this crate is not a member, so it cannot
# inherit them); keep the two equal, a xtask unit test compares them. Clippy runs over the
# targets with the pinned nightly in fuzz.yml.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "decode_path"
path = "fuzz_targets/decode_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rewrite_html"
path = "fuzz_targets/rewrite_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_header"
path = "fuzz_targets/host_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "change_sequence"
path = "fuzz_targets/change_sequence.rs"
test = false
doc = false
bench = false

# Its own workspace root keeps Cargo from attaching this crate to the repository workspace.
[workspace]
