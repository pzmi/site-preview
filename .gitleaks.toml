# Gitleaks policy (foundation.md section 8, D23). The default rule set is the baseline; the
# repository is scanned across its whole history by `cargo xtask security`.
#
# There is deliberately no allowlist: the scan of the existing history is clean, and test
# fixtures build their fake secrets at run time in a temporary directory instead of
# committing them. Add an entry here only for a reviewed false positive, scoped to one
# rule and one path, with a comment saying why. Commit trailers such as the session URL
# are not matched by any default rule.

[extend]
useDefault = true
