# Pinned development tools (ADR 0010). `cargo xtask doctor` checks them, `cargo xtask
# install-tools [tool...]` installs the ones it can. Versions are exact; bump them here only.
#
# method = "cargo"   : cargo install --locked <crate>@<version>
# method = "rustup"  : rustup toolchain install nightly-<date> --profile minimal
# method = "manual"  : not installable by xtask; `url` says where to get it
# method = "lockfile": version owned by a package-lock.json, noted here, not checked by doctor
#
# probe = [program, args...] is run to read the installed version; the output must contain
# the exact version as a whitespace-separated token (a leading "v" is ignored), or, with
# contains = true, as a substring.

[tools.cargo-nextest]
version = "0.9.148"
method = "cargo"
probe = ["cargo-nextest", "nextest", "--version"]

[tools.cargo-deny]
version = "0.20.2"
method = "cargo"
probe = ["cargo-deny", "deny", "--version"]

[tools.cargo-llvm-cov]
version = "0.9.1"
method = "cargo"
probe = ["cargo-llvm-cov", "llvm-cov", "--version"]

[tools.cargo-mutants]
version = "27.1.0"
method = "cargo"
probe = ["cargo-mutants", "mutants", "--version"]

[tools.cargo-fuzz]
version = "0.13.2"
method = "cargo"
probe = ["cargo-fuzz", "fuzz", "--version"]

[tools.cargo-cyclonedx]
version = "0.5.9"
method = "cargo"
probe = ["cargo-cyclonedx", "cyclonedx", "--version"]

[tools.gitleaks]
version = "8.30.1"
method = "manual"
url = "https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1"
probe = ["gitleaks", "version"]

[tools.actionlint]
version = "1.7.12"
method = "manual"
url = "https://github.com/rhysd/actionlint/releases/tag/v1.7.12"
probe = ["actionlint", "-version"]

# Apalache is the version the pinned quint release downloads and is validated against; it is
# run by the scheduled formal lane only.
[tools.apalache]
version = "0.62.1"
method = "manual"
url = "https://github.com/apalache-mc/apalache/releases/tag/v0.62.1"
probe = ["apalache-mc", "version"]

# The one dated nightly (ADR 0026): cargo-fuzz and Miri only, never production builds.
[tools.nightly]
version = "nightly-2026-10-01"
method = "rustup"
probe = ["rustup", "toolchain", "list"]
contains = true

# Node tools. Their versions are owned by the lockfiles; they are noted here, not checked.
[tools.quint]
version = "0.33.0"
method = "lockfile"
lockfile = "formal/package-lock.json"

# Pinned to the 1.56.x line, the release matching the preinstalled Chromium 1194 (D15, ADR 0016);
# a newer release would need a newer browser build. 1.56.1 is the latest 1.56 patch.
[tools."@playwright/test"]
version = "1.56.1"
method = "lockfile"
lockfile = "tests/e2e/browser/package-lock.json"
