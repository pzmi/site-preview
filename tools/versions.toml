# Pinned development tools (ADR 0010). `cargo xtask doctor` checks them, `cargo xtask
# install-tools [tool...]` installs the ones it can. Versions are exact; bump them here only.
#
# method = "cargo"   : cargo install --locked <crate>@<version>
# method = "rustup"  : rustup toolchain install nightly-<date> --profile minimal
# method = "manual"  : not installable by xtask; `url` says where to get it
# method = "lockfile": version owned by a package-lock.json, noted here, not checked by doctor
# features = "a b"   : (method cargo) passed as --features to cargo install
#
# probe = [program, args...] is run to read the installed version; the output must contain
# the exact version as a whitespace-separated token (a leading "v" is ignored), or, with
# contains = true, as a substring.

[tools.cargo-nextest]
version = "0.9.148"
method = "cargo"
probe = ["cargo-nextest", "nextest", "--version"]

[tools.cargo-deny]
version = "0.20.2"
method = "cargo"
probe = ["cargo-deny", "deny", "--version"]

[tools.cargo-llvm-cov]
version = "0.9.1"
method = "cargo"
probe = ["cargo-llvm-cov", "llvm-cov", "--version"]

[tools.cargo-mutants]
version = "27.1.0"
method = "cargo"
probe = ["cargo-mutants", "mutants", "--version"]

[tools.cargo-fuzz]
version = "0.13.2"
method = "cargo"
probe = ["cargo-fuzz", "fuzz", "--version"]

# The SBOMs of a release (OPS-06, ADR 0078): `cargo xtask sbom` runs `cargo cyclonedx` once per
# release target; the release workflow installs it with `install-tools`, never from a cache.
[tools.cargo-cyclonedx]
version = "0.5.9"
method = "cargo"
probe = ["cargo-cyclonedx", "cyclonedx", "--version"]

# The third-party notices of the release archive (OPS-05, ADR 0076): `cargo xtask release-check`
# runs `cargo about generate` with the committed `about.toml` and `about.hbs`.
[tools.cargo-about]
version = "0.9.2"
method = "cargo"
features = "cli"   # the crate's binary is behind this feature
probe = ["cargo-about", "about", "--version"]

[tools.gitleaks]
version = "8.30.1"
method = "manual"
url = "https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1"
probe = ["gitleaks", "version"]

[tools.actionlint]
version = "1.7.12"
method = "manual"
url = "https://github.com/rhysd/actionlint/releases/tag/v1.7.12"
probe = ["actionlint", "-version"]

# Apalache is the version the pinned quint release downloads and is validated against; it is
# run by the scheduled formal lane only (`cargo xtask formal-verify`, ADR 0061). Quint would
# download it unchecked, so `formal-verify` fetches the release tarball itself, refuses it
# unless its SHA-256 equals `sha256` below, and unpacks it where Quint looks for it
# (~/.quint/apalache-dist-<version>, or $QUINT_HOME) before Quint runs. `doctor` probes that
# binary, not PATH. A new version needs a new hash, computed from the real download.
[tools.apalache]
version = "0.62.1"
method = "manual"
url = "https://github.com/apalache-mc/apalache/releases/tag/v0.62.1"
probe = ["apalache-mc", "version"]
sha256 = "38202a8c4ebeb3ab73e0fe5a7e4bb948442d46ad5de8a7fb45c9e5cac2beb2a6"

# The one dated nightly (ADR 0026): cargo-fuzz and Miri only, never production builds.
[tools.nightly]
version = "nightly-2026-10-01"
method = "rustup"
probe = ["rustup", "toolchain", "list"]
contains = true

# Node runs the client.js unit tests (D15) and the Quint CLI; development only (foundation.md
# section 1, item 4). The pin is the major line (22.x): the probe refuses any other, and CI installs 22 with
# a SHA-pinned actions/setup-node in every job that runs Node, so a runner image that moves to
# a newer Node cannot break the gate.
[tools.node]
version = "v22."
method = "manual"
url = "https://nodejs.org/en/download"
probe = ["node", "--version"]
contains = true

# Node tools. Their versions are owned by the lockfiles; they are noted here, not checked.
# `cargo xtask conformance` runs Quint with `--backend typescript`, so its evaluator is the
# locked package and nothing is downloaded at run time (ADR 0052).
[tools.quint]
version = "0.33.0"
method = "lockfile"
lockfile = "formal/package-lock.json"

# Pinned to the 1.56.x line, the release matching the preinstalled Chromium 1194 (D15, ADR 0016);
# a newer release would need a newer browser build. 1.56.1 is the latest 1.56 patch.
[tools."@playwright/test"]
version = "1.56.1"
method = "lockfile"
lockfile = "tests/e2e/browser/package-lock.json"
