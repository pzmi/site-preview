[package]
name = "preview-cli"
description = "Zero-config local live-reload server for static sites."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "site-preview"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "std", "help", "usage", "error-context"] }
preview-composition = { path = "../preview-composition", version = "0.1.0" }
serde_json = { version = "1.0.152", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
preview-testkit = { path = "../preview-testkit" }
tempfile = "3.27.0"
