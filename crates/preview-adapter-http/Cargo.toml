[package]
name = "preview-adapter-http"
description = "HTTP handlers, HTML injection and live-reload transport behind the application ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
preview-application = { path = "../preview-application" }
preview-domain = { path = "../preview-domain" }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "sync"] }
tokio-stream = { version = "0.1.19", default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"
preview-testkit = { path = "../preview-testkit" }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
