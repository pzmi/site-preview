[package]
name = "preview-composition"
description = "The only production wiring root: constructs adapters and runs the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
preview-domain = { path = "../preview-domain" }
preview-application = { path = "../preview-application" }
preview-adapter-fs = { path = "../preview-adapter-fs" }
preview-adapter-http = { path = "../preview-adapter-http" }
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "net", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
