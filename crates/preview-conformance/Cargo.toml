[package]
name = "preview-conformance"
description = "Drives the real code from Quint model traces and compares observable state; test only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
preview-domain = { path = "../preview-domain" }
preview-application = { path = "../preview-application" }
preview-testkit = { path = "../preview-testkit" }
preview-adapter-fs = { path = "../preview-adapter-fs" }
preview-adapter-http = { path = "../preview-adapter-http" }
serde_json = { version = "1.0.152", default-features = false, features = ["std"] }
preview-composition = { path = "../preview-composition" }
axum = { version = "0.8.9", default-features = false }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "time", "test-util"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[dev-dependencies]
tempfile = "3.27.0"
