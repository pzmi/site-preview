# nextest configuration (foundation.md section 9). Flaky reruns are failures: no retries.

[test-groups]
# Real OS watcher tests share inotify/FSEvents resources; cap their parallelism.
# Tests join the group with a `[[profile.<name>.overrides]]` filter; the
# `test(/^os_watcher::/)` filter below puts the OS watcher tests in it.
os-watcher = { max-threads = 4 }

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# PROPTEST_CASES for this profile is set by `cargo xtask test` (tools/xtask/src/test.rs):
# nextest has no profile-level env table. Failing seeds persist in each crate's committed
# `proptest-regressions/` directory.

# The Miri lane (`cargo xtask formal-verify --miri`, TEST-09): Miri runs tests two to three
# orders of magnitude slower than native code, so a test may take minutes. No retries, and a
# test still ends after the terminate-after periods (20 minutes), so a hang is a failure.
[profile.miri]
retries = 0
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

[[profile.default.overrides]]
filter = "test(/^os_watcher::/)"
test-group = "os-watcher"

[[profile.ci.overrides]]
filter = "test(/^os_watcher::/)"
test-group = "os-watcher"
